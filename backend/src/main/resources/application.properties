# ==========================================
# APPLICATION
# ==========================================

spring.application.name=backend

# ==========================================
# SERVER
# ==========================================

server.port=8080

# ==========================================
# MYSQL DATABASE
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/coco_products

spring.datasource.username=root

spring.datasource.password=Robin

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# SESSION
# ==========================================

# The browser stores only this opaque server-side session identifier.
server.servlet.session.cookie.name=JSESSIONID

# Session expires after 30 minutes
# of inactivity.

server.servlet.session.timeout=30m

# Browser JavaScript cannot directly read
# the JSESSIONID cookie.

server.servlet.session.cookie.http-only=true

# Development uses HTTP localhost, so Secure is disabled here.
# Enable it when serving the backend over HTTPS in production.

server.servlet.session.cookie.secure=false

# Cookie protection

server.servlet.session.cookie.same-site=lax